<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>حبوشتي 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Cairo', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        /* ============ صفحة تسجيل الدخول ============ */
        .login-container {
            width: 100%;
            max-width: 450px;
            background: rgba(20, 10, 25, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 3rem;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 150, 200, 0.3);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 80px rgba(255, 100, 150, 0.2), inset 0 0 40px rgba(255, 150, 200, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
            transition: all 0.5s ease;
        }

        .login-container.hidden {
            display: none;
        }

        .login-heart {
            font-size: 5rem;
            animation: loginHeartBeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 25px #ff69b4) drop-shadow(0 0 50px #ff1493);
        }

        @keyframes loginHeartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .login-title {
            color: #ffb3d9;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 20px #ff99c8, 0 0 40px #b83b6e;
            letter-spacing: 2px;
        }

        .login-subtitle {
            color: #e0c0d0;
            font-size: 1rem;
            opacity: 0.8;
            margin-top: -0.8rem;
        }

        .password-input-wrapper {
            position: relative;
            width: 100%;
        }

        .password-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            border: 2px solid rgba(255, 150, 200, 0.4);
            background: rgba(0, 0, 0, 0.5);
            color: #ffd9ec;
            font-size: 1.2rem;
            text-align: center;
            font-family: inherit;
            letter-spacing: 3px;
            transition: all 0.3s;
            outline: none;
        }

        .password-input:focus {
            border-color: #ff85b3;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
            background: rgba(20, 5, 15, 0.7);
        }

        .password-input::placeholder {
            color: rgba(255, 200, 220, 0.4);
            letter-spacing: 1px;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 3rem;
            border: none;
            background: linear-gradient(135deg, #ff69b4, #c71585);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 2px;
            box-shadow: 0 10px 35px rgba(255, 20, 147, 0.5), 0 0 60px rgba(255, 105, 180, 0.3);
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 15px 45px rgba(255, 20, 147, 0.7), 0 0 80px rgba(255, 105, 180, 0.5);
        }

        .login-btn:active {
            transform: scale(0.96);
        }

        .hint-text {
            color: #ffb3d9;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.4s;
            min-height: 1.5rem;
            text-shadow: 0 0 10px #ff99c8;
        }

        .hint-text.visible {
            opacity: 1;
            animation: hintShake 0.5s ease;
        }

        @keyframes hintShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-5px); }
        }

        .login-error {
            color: #ff6b8a;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }

        /* ============ الصفحة الرئيسية بعد الدخول ============ */
        .main-dashboard {
            display: none;
            width: 100%;
            max-width: 650px;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 1rem;
        }

        .main-dashboard.active {
            display: flex;
        }

        .dashboard-title {
            color: #ffd9ec;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 25px #ff99c8, 0 0 50px #b83b6e;
            letter-spacing: 2px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 25px #ff99c8, 0 0 50px #b83b6e; }
            50% { text-shadow: 0 0 45px #ff99c8, 0 0 80px #ff69b4, 0 0 100px #ff1493; }
        }

        .sites-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            width: 100%;
        }

        .site-card {
            background: rgba(25, 12, 33, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 2.5rem;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(255, 180, 210, 0.35);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 120, 160, 0.15);
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            text-decoration: none;
            color: inherit;
        }

        .site-card:hover {
            transform: translateY(-10px) scale(1.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 70px rgba(255, 120, 160, 0.4);
            border-color: rgba(255, 180, 210, 0.7);
        }

        .site-card:active {
            transform: scale(0.96);
        }

        .site-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.5), 0 0 50px rgba(255, 150, 200, 0.3);
            border: 3px solid rgba(255, 200, 220, 0.6);
            transition: all 0.4s;
            background: rgba(30, 10, 20, 0.8);
        }

        .site-card:hover .site-icon {
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.8), 0 0 70px rgba(255, 150, 200, 0.5);
            border-color: #ffb3d9;
        }

        .site-name {
            color: #ffd9ec;
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 0 0 15px #ff99c8;
            letter-spacing: 1px;
        }

        .site-link-text {
            color: rgba(255, 200, 220, 0.6);
            font-size: 0.75rem;
            word-break: break-all;
            direction: ltr;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ============ مشغل اليوتيوب ============ */
        .youtube-section {
            width: 100%;
            max-width: 500px;
            margin-top: 1rem;
            text-align: center;
        }

        .youtube-label {
            color: #ffb3d9;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 15px #ff99c8;
        }

        .youtube-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.4), 0 0 60px rgba(255, 20, 147, 0.2);
            border: 2px solid rgba(255, 180, 210, 0.3);
        }

        .youtube-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 2rem;
        }

        /* ============ تأثيرات ============ */
        .shake {
            animation: shake 0.6s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(6px); }
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            font-size: 1.5rem;
            animation: particleFloat 4s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* زر تسجيل الخروج */
        .logout-btn {
            background: rgba(255, 100, 130, 0.2);
            border: 1px solid rgba(255, 150, 180, 0.5);
            color: #ffd9ec;
            padding: 0.7rem 2rem;
            border-radius: 3rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        .logout-btn:hover {
            background: rgba(255, 60, 100, 0.4);
            box-shadow: 0 0 25px rgba(255, 60, 100, 0.5);
            border-color: #ff99b3;
        }
    </style>
</head>
<body>

    <!-- جسيمات خلفية -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- ==================== شاشة تسجيل الدخول ==================== -->
    <div class="login-container" id="loginContainer">
        <div class="login-heart">💝</div>
        <div class="login-title">أهلاً بحبوشتي</div>
        <div class="login-subtitle">أدخلي كلمة السر يا روحي 💕</div>
        <div class="password-input-wrapper">
            <input type="password" class="password-input" id="passwordInput" placeholder="••••••••" autocomplete="off">
        </div>
        <button class="login-btn" id="loginBtn" onclick="checkPassword()">💕 دخول 💕</button>
        <div class="login-error" id="loginError"></div>
        <div class="hint-text" id="hintText">دلع حبيبتي</div>
    </div>

    <!-- ==================== لوحة التحكم الرئيسية ==================== -->
    <div class="main-dashboard" id="mainDashboard">
        <div class="dashboard-title">✨ حبوشتي ✨</div>

        <div class="sites-grid">
            <!-- الموقع الأول: خريجة 2008 -->
            <a href="https://share.google/aFeQ6mxGish1i3KoG" target="_blank" class="site-card">
                <img src="https://i.ibb.co/pBVpTqdV/1778667882122.png" alt="خريجة 2008" class="site-icon" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23ffb3d9%22/%3E%3Ctext x=%2250%22 y=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2230%22%3E🎓%3C/text%3E%3C/svg%3E';">
                <div class="site-name">🎓 خريجة 2008</div>
                <div class="site-link-text">share.google/aFeQ6mxGish1i3KoG</div>
            </a>

            <!-- الموقع الثاني: نصي الثاني -->
            <a href="https://share.google/rohTMmtrZI6YMUscc" target="_blank" class="site-card">
                <img src="https://i.pinimg.com/736x/07/5f/cd/075fcd0738ec4a972064f19ac90a8d15.jpg" alt="نصي الثاني" class="site-icon" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23ffd700%22/%3E%3Ctext x=%2250%22 y=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2230%22%3E💍%3C/text%3E%3C/svg%3E';">
                <div class="site-name">💍 نصي الثاني</div>
                <div class="site-link-text">share.google/rohTMmtrZI6YMUscc</div>
            </a>
        </div>

        <!-- فيديو يوتيوب -->
        <div class="youtube-section">
            <div class="youtube-label">كمان هدية🥺💗</div>
            <div class="youtube-wrapper">
                <iframe src="https://www.youtube.com/embed/0Ri7iAm28nE?si=gw6EOkaX4VzS6-TU" title="أغنيتنا" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <!-- زر تسجيل الخروج -->
        <button class="logout-btn" onclick="logout()">🚪الخروج</button>
    </div>

    <script>
        // ========== كلمات السر المسموحة ==========
        const validPasswords = [
            'حبوشتي', 'حلا', 'حبوش', 'حلوله', 'مرتي', 'حياتي', 'حبيبتي',
            'haboushti', 'hala', 'haboush', 'halouleh', 'marti', 'hayati', 'habibti'
        ];

        const loginContainer = document.getElementById('loginContainer');
        const mainDashboard = document.getElementById('mainDashboard');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const hintText = document.getElementById('hintText');
        const particlesContainer = document.getElementById('particlesContainer');

        let loginAttempts = 0;

        // ========== إنشاء جسيمات خلفية ==========
        function createParticles() {
            const emojis = ['💕', '💖', '💗', '💓', '✨', '💝', '💘', '🥺', '💍', '🎓', '🌸', '💞'];
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('span');
                particle.className = 'particle';
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = (60 + Math.random() * 40) + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = (3 + Math.random() * 6) + 's';
                particle.style.fontSize = (1 + Math.random() * 2.5) + 'rem';
                particlesContainer.appendChild(particle);
            }
        }

        createParticles();

        // ========== التحقق من كلمة السر ==========
        function checkPassword() {
            const enteredPassword = passwordInput.value.trim();
            loginError.textContent = '';
            hintText.classList.remove('visible');

            if (enteredPassword === '') {
                loginError.textContent = '🌸 أدخلي كلمة السر يا جميلة';
                shakeElement(loginContainer);
                return;
            }

            // التحقق من كلمة السر (مقارنة بدون حساسية للأحرف الكبيرة)
            const isValid = validPasswords.some(pass => 
                enteredPassword.toLowerCase() === pass.toLowerCase()
            );

            if (isValid) {
                // نجاح الدخول
                loginSuccess();
            } else {
                // فشل الدخول
                loginAttempts++;
                loginError.textContent = '❌ كلمة السر غلط يا روح القلب';
                hintText.classList.add('visible');
                shakeElement(loginContainer);
                passwordInput.value = '';
                passwordInput.focus();

                // إخفاء التلميح بعد 4 ثواني
                setTimeout(() => {
                    hintText.classList.remove('visible');
                }, 4000);
            }
        }

        // ========== نجاح الدخول ==========
        function loginSuccess() {
            loginContainer.classList.add('hidden');
            mainDashboard.classList.add('active');
            
            // تأثير احتفالي
            createSuccessBurst();
        }

        // ========== تأثير احتفالي عند الدخول ==========
        function createSuccessBurst() {
            const burstEmojis = ['💕', '💖', '✨', '💝', '🎉', '💘', '🥰', '🌸', '💍', '🎓'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const burst = document.createElement('span');
                    burst.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
                    burst.style.cssText = `
                        position: fixed;
                        font-size: ${2 + Math.random() * 4}rem;
                        left: ${20 + Math.random() * 60}%;
                        top: ${30 + Math.random() * 40}%;
                        pointer-events: none;
                        z-index: 9999;
                        animation: burstPop 0.8s ease-out forwards;
                    `;
                    document.body.appendChild(burst);
                    setTimeout(() => burst.remove(), 800);
                }, i * 40);
            }
        }

        // ========== تأثير الاهتزاز ==========
        function shakeElement(element) {
            element.classList.add('shake');
            setTimeout(() => element.classList.remove('shake'), 600);
        }

        // ========== تسجيل الخروج ==========
        function logout() {
            mainDashboard.classList.remove('active');
            loginContainer.classList.remove('hidden');
            passwordInput.value = '';
            loginError.textContent = '';
            hintText.classList.remove('visible');
            loginAttempts = 0;
            passwordInput.focus();
        }

        // ========== الضغط على Enter للتسجيل ==========
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // ========== إضافة أنيميشن burstPop ==========
        const burstStyle = document.createElement('style');
        burstStyle.textContent = `
            @keyframes burstPop {
                0% { transform: scale(0) rotate(0deg); opacity: 1; }
                50% { transform: scale(1.5) rotate(180deg); opacity: 0.8; }
                100% { transform: scale(0.3) rotate(360deg); opacity: 0; }
            }
        `;
        document.head.appendChild(burstStyle);

        // ========== تركيز على حقل الإدخال ==========
        passwordInput.focus();
    </script>
</body>
</html>
